# Supabase CLI configuration for the local stack (`supabase start`).
# Values not listed here fall back to the CLI defaults.

project_id = "lockkaro"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# 5 MB, matches MAX_FILE_SIZE_BYTES in @lockkaro/validation.
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
# Sign-up puts you straight into your vault. Turning this on locally would
# leave every new account stranded at the sign-in screen waiting for a mail
# server that isn't there. Turn it on in a real deployment.
enable_confirmations = false
