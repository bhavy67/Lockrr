<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Offline · LockKaro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4F46E5" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0a0a0b;
        --muted: #71717a;
        --border: rgba(0, 0, 0, 0.1);
        --primary: #4f46e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0b;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --border: rgba(255, 255, 255, 0.12);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter,
          sans-serif;
        font-feature-settings: "cv02", "cv03";
        display: grid;
        place-items: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: var(--primary);
        margin-bottom: 20px;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 8px;
      }
      p {
        font-size: 15px;
        line-height: 1.55;
        color: var(--muted);
        margin: 0 0 24px;
      }
      button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--primary);
        color: #fff;
        border: 0;
        padding: 10px 20px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
      }
      button:hover {
        filter: brightness(1.05);
      }
      button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      .meta {
        margin-top: 32px;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 15v-3a5 5 0 1 1 10 0v3" stroke="#fff" stroke-width="2.6"
                stroke-linecap="round" fill="none" />
          <rect x="9" y="14" width="14" height="11" rx="2.4" fill="#fff" />
          <circle cx="16" cy="19.5" r="1.7" fill="#4F46E5" />
        </svg>
      </span>
      <h1>You&rsquo;re offline.</h1>
      <p>
        LockKaro needs a connection to reach your vault. Your documents stay
        safe on the server &mdash; they&rsquo;ll be here when you&rsquo;re back.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="meta">LockKaro &middot; Lock it. Clock it.</p>
    </main>
  </body>
</html>
