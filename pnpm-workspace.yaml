packages:
  - "apps/*"
  - "packages/*"

# Explicitly allow install scripts for these native packages.
# Required by pnpm 11's supply-chain policy.
allowBuilds:
  esbuild: true
  sharp: true
  tesseract.js: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@next/env@15.5.24'
  - '@next/eslint-plugin-next@15.5.24'
  - '@next/swc-darwin-arm64@15.5.24'
  - '@next/swc-darwin-x64@15.5.24'
  - '@next/swc-linux-arm64-gnu@15.5.24'
  - '@next/swc-linux-arm64-musl@15.5.24'
  - '@next/swc-linux-x64-gnu@15.5.24'
  - '@next/swc-linux-x64-musl@15.5.24'
  - '@next/swc-win32-arm64-msvc@15.5.24'
  - '@next/swc-win32-x64-msvc@15.5.24'
  - eslint-config-next@15.5.24
  - next@15.5.24

onlyBuiltDependencies:
  - esbuild
  - sharp
  - tesseract.js
  - unrs-resolver
